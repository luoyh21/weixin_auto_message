name: scrape-topic

# 专题情报：手动触发，在 GitHub 海外 runner 上用 Jina Reader 抓取专题各条目全文+图片，
# POST 到国内服务器 /ingest/topic。之后在服务器重新生成专题即可补全全文。
#
# 复用与 scrape-spacenews 相同的两个 Secret：
#   INGEST_URL    例 http://<server>:<port>/ingest/spacenews
#   INGEST_TOKEN  与服务器 .env 的 SPACENEWS_INGEST_TOKEN 一致

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "专题 ID"
        required: false
        default: "space-tug"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Scrape & push
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: python scripts/scrape_topic_remote.py
