name: scrape-spacenews

# 每 30 分钟在 GitHub 海外 runner 上抓取 SpaceNews RSS（含 content:encoded 全文）
# 解析后 POST 到国内服务器的 /ingest/spacenews。
# 配置：在仓库 Settings → Secrets 中添加
#   INGEST_URL     例 http://your.server.cn:8503/ingest/spacenews
#   INGEST_TOKEN   与服务器 .env 的 SPACENEWS_INGEST_TOKEN 一致

on:
  schedule:
    # 一天 2 次。
    # 注意：GitHub Actions 的 schedule cron 在共享 runner 上常被延迟 1~3 小时
    # 才真正调度，所以这里写的时间是「期望提前量」——cron 标称 Beijing 05:55 /
    # 13:55，实际触发大概率落在 07:55 / 15:55 之前，给 08:00 / 16:00 推送预留
    # 2 小时延迟缓冲。本地 WINDOW_HOURS=24，提前抓也不会被过滤。
    - cron: "55 21 * * *"   # 标称 05:55 Beijing（期望实际触发 ≤ 07:55）
    - cron: "55 5 * * *"    # 标称 13:55 Beijing（期望实际触发 ≤ 15:55）
  # 当抓取脚本或本 workflow 自身有改动并 push 上来时，自动跑一次。
  # 这样调整代码后无需再到 UI 点 “Run workflow”（该按钮偶尔会报
  # “Failed to queue workflow run”，本质是 GH 调度通道的瞬时故障）。
  push:
    branches: [master, main]
    paths:
      - 'scripts/scrape_spacenews_remote.py'
      - '.github/workflows/scrape-spacenews.yml'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests feedparser beautifulsoup4 lxml
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: scripts/scrape_spacenews_remote.state.json
          key: spacenews-scrape-state-${{ github.run_id }}
          restore-keys: |
            spacenews-scrape-state-
      - name: Scrape & push
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          FEED_URLS: ${{ vars.FEED_URLS || 'SpaceNews|https://spacenews.com/feed/,NASASpaceflight|https://www.nasaspaceflight.com/feed/' }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS || '24' }}
        run: python scripts/scrape_spacenews_remote.py
